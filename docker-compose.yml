services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: always
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # api principal
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      MONGO_URI: ${MONGO_URI}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "8000"      
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongos:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - default
      - mongo-cluster

  # microservicio busqueda
  search:
    build:
      context: .
      dockerfile: Dockerfile.search
    restart: always
    env_file: .env
    environment:
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      SEARCH_PORT: 8001
    expose:
      - "8001"       #
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - default
      - mongo-cluster

  # Nginx 
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"      
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - search
    networks:
      - default

  # ── MongoDB sharding ───────────────────────────────────────────────────────
  configsvr:
    image: mongo:7
    restart: always
    container_name: configsvr
    command: ["mongod", "--configsvr", "--replSet", "cfgReplSet", "--bind_ip_all", "--port", "27019"]
    volumes:
      - configsvr_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27019", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  mongos:
    image: mongo:7
    restart: always
    container_name: mongos
    command: ["mongos", "--bind_ip_all", "--configdb", "cfgReplSet/configsvr:27019", "--port", "27017"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - configsvr
      - mongo1
      - mongo2
      - mongo3
    networks:
      - mongo-cluster

  mongo1:
    image: mongo:7
    restart: always
    container_name: mongo1
    command: ["mongod", "--shardsvr", "--replSet", "shard0", "--bind_ip_all", "--port", "27018"]
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  mongo2:
    image: mongo:7
    restart: always
    container_name: mongo2
    command: ["mongod", "--shardsvr", "--replSet", "shard0", "--bind_ip_all", "--port", "27018"]
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  mongo3:
    image: mongo:7
    restart: always
    container_name: mongo3
    command: ["mongod", "--shardsvr", "--replSet", "shard0", "--bind_ip_all", "--port", "27018"]
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--port", "27018", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  # ElasticSearch  Kibana
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200   
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  adminer:
    image: adminer
    restart: always
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

  #Hadoop HDFS
  hadoop-namenode:
    image: apache/hadoop:3.3.6
    container_name: hadoop-namenode
    hostname: ${HADOOP_NAMENODE_HOST}
    restart: always
    command: ["hdfs", "namenode"]
    environment:
      HADOOP_ROLE: namenode
      HDFS_NAMENODE_RPC_PORT: ${HADOOP_NAMENODE_PORT}
      HDFS_NAMENODE_HTTP_PORT: ${HADOOP_NAMENODE_HTTP_PORT}
      ENSURE_NAMENODE_DIR: "/data/namenode"
      CORE-SITE_XML_fs.defaultFS: "hdfs://${HADOOP_NAMENODE_HOST}:${HADOOP_NAMENODE_PORT}"
      HDFS-SITE_XML_dfs.namenode.name.dir: "/data/namenode"
    ports:
      - "${HADOOP_NAMENODE_HTTP_PORT}:${HADOOP_NAMENODE_HTTP_PORT}"
      - "${HADOOP_NAMENODE_PORT}:${HADOOP_NAMENODE_PORT}"
    volumes:
      - hdfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${HADOOP_NAMENODE_HTTP_PORT} || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - default

  hadoop-datanode:
    image: apache/hadoop:3.3.6
    container_name: hadoop-datanode
    restart: always
    command: ["hdfs", "datanode"]
    environment:
      HADOOP_ROLE: datanode
      NAMENODE_HOST: ${HADOOP_NAMENODE_HOST}
      NAMENODE_RPC_PORT: ${HADOOP_NAMENODE_PORT}
      CORE-SITE_XML_fs.defaultFS: "hdfs://${HADOOP_NAMENODE_HOST}:${HADOOP_NAMENODE_PORT}"
      HDFS-SITE_XML_dfs.datanode.data.dir: "/data/datanode"
    volumes:
      - hdfs_data:/data
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    networks:
      - default

  #Hive Metastore (backend: PostgreSQL)
  hive-metastore-db:
    image: postgres:16-alpine
    container_name: hive-metastore-db
    restart: always
    environment:
      POSTGRES_USER: ${METASTORE_DB_USER}
      POSTGRES_PASSWORD: ${METASTORE_DB_PASSWORD}
      POSTGRES_DB: ${METASTORE_DB_DATABASE}
    volumes:
      - hive_metastore_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METASTORE_DB_USER} -d ${METASTORE_DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  hive-metastore:
    image: apache/hive:4.0.0
    container_name: hive-metastore
    hostname: ${HIVE_METASTORE_HOST}
    restart: always
    command: --service metastore
    environment:
      DB_TYPE: postgres
      DB_HOST: ${METASTORE_DB_HOST}
      DB_PORT: ${METASTORE_DB_PORT}
      DB_DATABASE: ${METASTORE_DB_DATABASE}
      DB_USER: ${METASTORE_DB_USER}
      DB_PASSWORD: ${METASTORE_DB_PASSWORD}
      HIVE_METASTORE_PORT: ${HIVE_METASTORE_PORT}
      SERVICE_NAME: metastore
    ports:
      - "${HIVE_METASTORE_PORT}:${HIVE_METASTORE_PORT}"
    depends_on:
      hive-metastore-db:
        condition: service_healthy
    volumes:
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml
    networks:
      - default

  hive-server:
    image: apache/hive:4.0.0
    container_name: hive-server
    hostname: hive-server
    restart: always
    command: --service hiveserver2
    environment:
      DB_TYPE: postgres
      DB_HOST: ${METASTORE_DB_HOST}
      DB_PORT: ${METASTORE_DB_PORT}
      DB_DATABASE: ${METASTORE_DB_DATABASE}
      DB_USER: ${METASTORE_DB_USER}
      DB_PASSWORD: ${METASTORE_DB_PASSWORD}
      HIVE_METASTORE_HOST: ${HIVE_METASTORE_HOST}
      HIVE_METASTORE_PORT: ${HIVE_METASTORE_PORT}
      HIVE_SERVER2_THRIFT_PORT: ${HIVE_PORT}
      SERVICE_NAME: hiveserver2
    ports:
      - "${HIVE_PORT}:${HIVE_PORT}"
    volumes:
      - ./warehouse:/opt/warehouse:ro
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
    depends_on:
      hive-metastore:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    networks:
      - default

  #Spark
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    hostname: spark-master
    restart: always
    working_dir: /opt/spark
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8083:8080"
      - "7077:7077"
    volumes:
      - ./spark/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark:/opt/scripts:ro
      - ./warehouse/etl/staging:/opt/staging:ro
      - ./spark/output:/opt/spark/output
    command: ["bin/spark-class", "org.apache.spark.deploy.master.Master"]
    healthcheck:
      test: ["CMD", "/opt/spark/bin/spark-submit", "--version"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - default

  spark-worker:
    image: apache/spark:3.5.0
    restart: always
    working_dir: /opt/spark
    depends_on:
      - spark-master
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./spark/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./spark:/opt/scripts:ro
      - ./warehouse/etl/staging:/opt/staging:ro
      - ./spark/output:/opt/spark/output
    command: ["bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - default

  #Superset metadata DB
  superset-db:
    image: postgres:16-alpine
    container_name: superset-db
    restart: always
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  #Superset init (one-shot)
  superset-init:
    build:
      context: ./superset
      dockerfile: Dockerfile.superset
    container_name: superset-init
    command: bash /app/init_superset.sh
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-cambiame_en_produccion}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - ./superset/init_superset.sh:/app/init_superset.sh:ro
    depends_on:
      superset-db:
        condition: service_healthy
    networks:
      - default

  #Superset web UI
  superset:
    build:
      context: ./superset
      dockerfile: Dockerfile.superset
    container_name: superset
    restart: always
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-cambiame_en_produccion}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
    volumes:
      - ./superset/superset_config.py:/app/superset_config.py:ro
      - superset_data:/app/data
    depends_on:
      superset-db:
        condition: service_healthy
      hive-server:
        condition: service_started
    networks:
      - default

  # ── Airflow ──────────────────────────────────────────────────────────────

  airflow-db:
    image: postgres:16-alpine
    container_name: airflow-db
    restart: always
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-cambiame_en_produccion}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/config:/opt/airflow/config:ro
    entrypoint: /bin/bash
    command: >
      -c "
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true &&
        airflow connections import /opt/airflow/config/connections.yaml
      "
    networks:
      - default

  airflow-webserver:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-webserver
    restart: always
    command: airflow webserver
    ports:
      - "8085:8080"
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-cambiame_en_produccion}
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      DB_ENGINE: ${DB_ENGINE}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/config:/opt/airflow/config:ro
      - ./warehouse:/opt/warehouse:ro
      - ./spark:/opt/scripts:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - default

  airflow-scheduler:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    restart: always
    command: scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-cambiame_en_produccion}
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      DB_ENGINE: ${DB_ENGINE}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/config:/opt/airflow/config:ro
      - ./warehouse:/opt/warehouse:ro
      - ./spark:/opt/scripts:ro
      - airflow_logs:/opt/airflow/logs
    networks:
      - default

  airflow-worker:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: airflow-worker
    restart: always
    command: celery worker
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor

      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/1
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-cambiame_en_produccion}
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      HADOOP_USER_NAME: spark
      DB_ENGINE: ${DB_ENGINE}
      MONGO_URI: ${MONGO_URI}
      MONGO_DB: ${MONGO_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/config:/opt/airflow/config:ro
      - ./warehouse:/opt/warehouse:rw
      - ./spark:/opt/scripts:ro
      - ./spark/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./warehouse/etl/staging:/opt/staging:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - airflow_logs:/opt/airflow/logs
    networks:
      - default

  # ── Neo4J ────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - ./neo4j/staging:/var/lib/neo4j/import
      - ./warehouse/etl/staging/neo4j:/var/lib/neo4j/warehouse-import
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - default

volumes:
  postgres_data:
  keycloak_db_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  configsvr_data:
  elasticsearch_data:
  redis_data:
  hdfs_data:
  hive_metastore_data:
  superset_db_data:
  superset_data:
  airflow_db_data:
  airflow_logs:
  neo4j_data:

networks:
  mongo-cluster:
    driver: bridge
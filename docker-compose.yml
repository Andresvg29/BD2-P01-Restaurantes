services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # base de datos separada para Keycloak
  keycloak-db:
    image: postgres:16-alpine
    container_name: keycloak-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: always
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
  api:
    build: .
    container_name: api
    restart: always
    env_file: .env
    environment:
      POSTGRES_HOST: db
      KEYCLOAK_URL: ${KEYCLOAK_URL}
      MONGO_URI: ${MONGO_URI}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
    ports:
      - "${PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      mongos:
        condition: service_started
    networks:
      - default
      - mongo-cluster

  configsvr:
    image: mongo:7
    restart: always
    container_name: configsvr
    command:
      [
        "mongod",
        "--configsvr",
        "--replSet",
        "cfgReplSet",
        "--bind_ip_all",
        "--port",
        "27019",
      ]
    volumes:
      - configsvr_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27019",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  mongos:
    image: mongo:7
    restart: always
    container_name: mongos
    command: [
        "mongos",
        "--bind_ip_all",
        "--configdb",
        "cfgReplSet/configsvr:27019",
        "--port",
        "27017",
      ] # Corregir el nombre del replicaset si es cfgReplSet
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27017",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - configsvr
      - mongo1
      - mongo2
      - mongo3
    networks:
      - mongo-cluster

  mongo1:
    image: mongo:7
    restart: always
    container_name: mongo1
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard0",
        "--bind_ip_all",
        "--port",
        "27018",
      ]
    volumes:
      - mongo1_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27018",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  mongo2:
    image: mongo:7
    restart: always
    container_name: mongo2
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard0",
        "--bind_ip_all",
        "--port",
        "27018",
      ]
    volumes:
      - mongo2_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27018",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

  mongo3:
    image: mongo:7
    restart: always
    container_name: mongo3
    command:
      [
        "mongod",
        "--shardsvr",
        "--replSet",
        "shard0",
        "--bind_ip_all",
        "--port",
        "27018",
      ]
    volumes:
      - mongo3_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--port",
          "27018",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mongo-cluster

#elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch
    restart: always
    environment:
      - discovery.type=single-node          # modo standalone, sin cluster
      - xpack.security.enabled=false        # sin TLS/auth para desarrollo
      - ES_JAVA_OPTS=-Xms512m -Xmx512m     # 
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
#kibana 
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0   # misma versión que ES
    container_name: kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  adminer:
    image: adminer
    restart: always
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  postgres_data:
  keycloak_db_data:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  configsvr_data:

networks:
  mongo-cluster:
    driver: bridge
